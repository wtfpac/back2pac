backend:
  name: github
  repo: wtfpac/back2pac
  branch: main
  # aponta para as rotas de autenticacao que criamos
  base_url: https://back2pac.vercel.app
  auth_endpoint: api/auth

# idioma da interface do painel
locale: pt

# tira o painel de preview de todas as colecoes
editor:
  preview: false

media_folder: public/images
public_folder: /images

# multiple_folders faz cada idioma virar uma subpasta,
# igual a estrutura content/posts/pt e content/posts/en.
# a ordem desta lista define a ordem das colunas no editor
i18n:
  structure: multiple_folders
  locales: [pt, en]
  default_locale: pt

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: content/posts
    create: true
    slug: '{{slug}}'
    i18n: true
    fields:
      - { name: title, label: Título, widget: string, i18n: true }
      # i18n duplicate mantem o mesmo valor nos dois idiomas
      - {
          name: date,
          label: Data,
          widget: datetime,
          date_format: 'YYYY-MM-DD',
          time_format: false,
          format: 'YYYY-MM-DD',
          i18n: duplicate,
        }
      - { name: summary, label: Resumo, widget: text, i18n: true }
      - { name: categories, label: Categorias, widget: list, i18n: true }
      - { name: body, label: Conteúdo, widget: markdown, i18n: true }

  - name: settings
    label: Configurações
    files:
      - name: site
        label: Site
        file: content/settings.json
        fields:
          - { name: siteUrl, label: URL do site, widget: string }
          - { name: showSearch, label: Mostrar busca no menu, widget: boolean }